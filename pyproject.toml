[project]
name = "hotel-data-scraper"
version = "0.1.0"
description = "Playwright-based hotel search data collector with anti-detection and parallel processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.2.3",
    "openpyxl==3.1.5",
    "playwright==1.50.0",
    "openai==0.28.0",
    "python-dotenv==1.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real booking.com site (opt-in, run with `pytest -m live`)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
