name: Debug star markup

# Temporary: dumps how booking.com renders star ratings to a GitHub runner,
# which differs from a local run. Delete once the difference is understood.
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - name: Dump star markup
        run: uv run python tests/debug_star_markup.py
